[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]

bytecode_hash = 'none'
ast = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
[invariant]
runs = 512
depth = 128
show_metrics = true

[fmt]
single_line_statement_blocks = "preserve"
multiline_func_header = "all"
sort_imports = true
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "remove"
wrap_comments = false
